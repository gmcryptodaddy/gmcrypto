name: Weekly Coin Snapshot

# Runs the snapshot script weekly, commits the updated snapshot, and pushes it.
# Vercel auto-deploys after the push.

on:
  schedule:
    - cron: '0 4 * * 0'  # Every Sunday at 04:00 UTC
  workflow_dispatch:      # Allow manual run from Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Up to 2 hours for snapshot (500 coins × 5s + retries)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run snapshot script
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          echo "Running snapshot script..."
          node scripts/snapshot-coins.js
          echo "Snapshot script finished"
          ls -lah public/coins-snapshot.json || echo "Snapshot file missing!"

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coins-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh coin snapshot [skip ci]"
            git push origin HEAD:main
            echo "Snapshot updated and pushed"
          fi
