name: Weekly Coin Snapshot

# Runs the snapshot script weekly, commits the updated snapshot, and pushes it.
# This refreshes static coin data (descriptions, links, ATH/ATL) without us
# having to do anything manually. Vercel auto-deploys after the push.

on:
  # Run every Sunday at 04:00 UTC (off-peak)
  schedule:
    - cron: '0 4 * * 0'

  # Allow manual runs from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed so the workflow can commit + push
    timeout-minutes: 90  # Snapshot takes ~45 min, give buffer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run snapshot script
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/snapshot-coins.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/coins-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh coin snapshot [skip ci]"
            git push
            echo "Snapshot updated and pushed"
          fi
